{% extends "base.html" %}

{% block title %}Admin Authentication{% endblock %}

{% block content %}
<div class="container mx-auto max-w-md py-12">
  <div class="bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Admin Authentication</h1>
    <form method="POST" action="{{ url_for('admin_review_auth') }}">
      <div class="mb-4">
        <label for="admin_key" class="block text-sm font-medium text-gray-700 mb-1">Admin Key</label>
        <input type="password" id="admin_key" name="admin_key" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Authenticate
      </button>
    </form>
  </div>
</div>
{% endblock %}
