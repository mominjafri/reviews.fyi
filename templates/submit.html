<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted - reviews.fyi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/submit.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-content">
                <div class="brand">
                    <img src="{{ url_for('static', filename= 'images/favicon.png') }}" alt="reviews.fyi logo" class="logo">
                    <span class="brand-name">reviews.fyi</span>
                </div>
                
                <div class="nav-links">
                    <a href="/top-rated" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22,7 13.5,15.5 8.5,10.5 2,17"></polyline>
                            <polyline points="16,7 22,7 22,13"></polyline>
                        </svg>
                        Top Rated
                    </a>
                    <a href="/companies" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="m22 21-3-3m0 0a6 6 0 1 0-3 3 3 3 0 0 0 3-3z"></path>
                        </svg>
                        Companies
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="thank-you-container">
            <div class="thank-you-card">
                <div class="check-icon-container">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22,4 12,14.01 9,11.01"></polyline>
                    </svg>
                </div>
                
                <div class="thank-you-content">
                    <h1 class="thank-you-title">Thank You!</h1>
                    <p class="thank-you-message">
                        Your review has been submitted and is pending approval from our team.
                    </p>
                </div>
                
                <div class="button-group">
                    <a href="/" class="return-btn">Return to Home</a>
                    {% if employee_id %}
                    <a href="{{ url_for('employee', employee_id=employee_id) }}" class="view-boss-btn">View Boss</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </main>
</body>
</html>
